name: Translate Language Files

# Triggers:
#   1. Push: whenever en-GB.astroid.ini changes on main branches.
#   2. Manual: workflow_dispatch with optional inputs so maintainers can
#      trigger a one-off translation run or force a full re-translation.
on:
  push:
    branches:
      - master
      - main
    paths:
      - 'language/en-GB/en-GB.astroid.ini'
  workflow_dispatch:
    inputs:
      locales:
        description: >
          Comma-separated list of target locales to sync.
          Leave blank to sync all default locales (de-DE,fr-FR,es-ES,pt-BR,zh-CN).
        required: false
        default: 'de-DE,fr-FR,es-ES,pt-BR,zh-CN'
      force:
        description: >
          Force re-translation of ALL keys, including those already translated.
          WARNING: this overwrites existing manual corrections.
        type: boolean
        required: false
        default: false

jobs:
  translate:
    name: Sync & translate language files
    runs-on: ubuntu-latest

    permissions:
      # Needed to push the translation branch and open the PR
      contents: write
      pull-requests: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # full history so git blame / diff works

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Run translation sync ──────────────────────────────────────────
      - name: Run sync_translations.py
        id: sync
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          EXTRA_ARGS=""

          # Honour --force input
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --force"
          fi

          # Honour custom --locales input
          TARGET_LOCALES="${{ github.event.inputs.locales }}"
          if [ -n "$TARGET_LOCALES" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --locales $TARGET_LOCALES"
          fi

          python .github/scripts/sync_translations.py $EXTRA_ARGS \
            2>&1 | tee /tmp/sync_output.txt

          # Capture exit code from python (not from tee)
          EXIT_CODE=${PIPESTATUS[0]}
          echo "script_exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE

      # ── 4. Detect changes ────────────────────────────────────────────────
      - name: Check for modified files
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No language file changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --name-only
          fi

      # ── 5. Open / update a PR ────────────────────────────────────────────
      - name: Create or update translation PR
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: translations/auto-sync
          delete-branch: true
          title: 'i18n: Auto-translate language files'
          commit-message: |
            i18n: Auto-translate language files

            Triggered by: ${{ github.workflow }} @ ${{ github.sha }}
          body: |
            ## Automated language file synchronisation

            This PR was created automatically by the
            [Translate Language Files](${{ github.server_url }}/${{ github.repository }}/actions/workflows/translate.yml)
            workflow after a change to `language/en-GB/en-GB.astroid.ini`.

            ### What changed

            The Python script `.github/scripts/sync_translations.py` compared
            every key in the English source against each target locale and
            translated **only the missing (or new) keys** via
            [DeepL](https://www.deepl.com/). Existing manual translations were
            **not overwritten**.

            <details>
            <summary>Script output</summary>

            ```
            $(cat /tmp/sync_output.txt 2>/dev/null || echo '(no output captured)')
            ```

            </details>

            ### Review checklist

            - [ ] Spot-check machine translations for accuracy in each locale.
            - [ ] Verify that `%s`, `%d`, `{...}` placeholders are intact.
            - [ ] Check HTML markup (links, `<code>` tags) has not been altered.
            - [ ] Review any `WARN` lines printed in the script output above.
            - [ ] Accept or correct translations as needed, then approve & merge.

            > ⚠️ Machine translations are a **baseline only**.
            > Native-speaker review is strongly recommended before each release.

            ---
            _Triggered by commit `${{ github.sha }}`_
          labels: |
            translations
            automated
