; Transform
ASTROID_ELEMENT_TRANSFORM_SETTINGS_LABEL="Transfürm (Erweitert)"
ASTROID_WIDGET_TRANSFORM_SCENES_LABEL="Transfürm Scenes"
ASTROID_WIDGET_TRANSFORM_SCENES_DESC="Transfürm Scenes are a powerful way zu create complex, multi-step animations that are triggered by scroll oder moverwenden movement. Each scene can have its own unique animation properties, allowing you zu create dynamic und engaging animations that respond zu verwendenr interactions. With Transfürm Scenes, you can easily create animations that are triggered by scroll oder moverwenden movement, making it easy zu add interactivity und engagement zu Ihre Website."
ASTROID_ELEMENT_TRANSFORM_SCENE_LABEL="Scene"
ASTROID_ELEMENT_TRANSFORM_MOVE_LABEL="Move"
ASTROID_ELEMENT_TRANSFORM_MOVE_DESC="Move allows you zu animate die Position of an element along the X und Y axes. Sie können specify the start und end points of the animation."
ASTROID_ELEMENT_TRANSFORM_ROTATE_LABEL="Rotate"
ASTROID_ELEMENT_TRANSFORM_ROTATE_DESC="Rotate allows you zu animate the rotation of an element around a specified axis. Sie können specify the start und end angles of the rotation."
ASTROID_ELEMENT_TRANSFORM_SCALE_LABEL="Scale"
ASTROID_ELEMENT_TRANSFORM_SCALE_DESC="Scale allows you zu animate the size of an element. Sie können specify the start und end scale values für both the X und Y axes."
ASTROID_ELEMENT_TRANSFORM_OPACITY_LABEL="Opacity"
ASTROID_ELEMENT_TRANSFORM_OPACITY_DESC="Opacity allows you zu animate the transparency of an element. Sie können specify the start und end opacity values, where 0 is fully transparent und 1 is fully opaque."
ASTROID_ELEMENT_TRANSFORM_SKEW_LABEL="Skew"
ASTROID_ELEMENT_TRANSFORM_SKEW_DESC="Skew allows you zu animate the skewing of an element along the X und Y axes. Sie können specify the start und end skew angles für both axes."
ASTROID_ELEMENT_TRANSFORM_FILTER_LABEL="Filter"
ASTROID_ELEMENT_TRANSFORM_FILTER_DESC="Filter allows you zu animate CSS filter properties such as weichzeichnen, brightness, contrast und grayscale. Sie können specify the start und end values für each filter property zu create dynamic visual effects on Ihre elements."
ASTROID_ELEMENT_TRANSFORM_BLUR_LABEL="Blur"
ASTROID_ELEMENT_TRANSFORM_BLUR_DESC="Blur allows you zu animate the weichzeichnenring of an element. Sie können specify the start und end weichzeichnen values, where 0 is no weichzeichnen und higher values create a stronger weichzeichnen effect."
ASTROID_ELEMENT_TRANSFORM_BRIGHTNESS_LABEL="Brightness"
ASTROID_ELEMENT_TRANSFORM_BRIGHTNESS_DESC="Brightness allows you zu animate the brightness of an element. Sie können specify the start und end brightness values, where 1 is the oderiginal brightness, values less than 1 wird darken the element, und values greater than 1 wird brighten the element."
ASTROID_ELEMENT_TRANSFORM_CONTRAST_LABEL="Contrast"
ASTROID_ELEMENT_TRANSFORM_CONTRAST_DESC="Contrast allows you zu animate the contrast of an element. Sie können specify the start und end contrast values, where 1 is the oderiginal contrast, values less than 1 wird decrease the contrast, und values greater than 1 wird increase the contrast of the element."
ASTROID_ELEMENT_TRANSFORM_GRAYSCALE_LABEL="Grayscale"
ASTROID_ELEMENT_TRANSFORM_GRAYSCALE_DESC="Grayscale allows you zu animate the grayscale of an element. Sie können specify the start und end grayscale values, where 0 is the oderiginal coloder, und values greater than 0 wird increase the grayscale effect on the element."
ASTROID_ELEMENT_TRANSFORM_SCROLL_SETTINGS_LABEL="Scrollen Einstellungen"
ASTROID_ELEMENT_TRANSFORM_SCROLL_SETTINGS_DESC="Scrollen Einstellungen allow you zu control how the animation is triggered by scroll events. Sie können specify the trigger point, duration, und easing of the animation."
ASTROID_ELEMENT_TRANSFORM_TRANSLATEX_LABEL="TranslateX"
ASTROID_ELEMENT_TRANSFORM_TRANSLATEX_DESC="TranslateX allows you zu animate the hoderizontal position of an element."
ASTROID_ELEMENT_TRANSFORM_TRANSLATEY_LABEL="TranslateY"
ASTROID_ELEMENT_TRANSFORM_TRANSLATEY_DESC="TranslateY allows you zu animate the vertical position of an element."
ASTROID_ELEMENT_TRANSFORM_ROTATEX_LABEL="RotateX"
ASTROID_ELEMENT_TRANSFORM_ROTATEX_DESC="RotateX allows you zu animate the rotation of an element around the X-axis."
ASTROID_ELEMENT_TRANSFORM_ROTATEY_LABEL="RotateY"
ASTROID_ELEMENT_TRANSFORM_ROTATEY_DESC="RotateY allows you zu animate the rotation of an element around the Y-axis."
ASTROID_ELEMENT_TRANSFORM_ROTATEZ_LABEL="RotateZ"
ASTROID_ELEMENT_TRANSFORM_ROTATEZ_DESC="RotateZ allows you zu animate the rotation of an element around the Z-axis."
ASTROID_ELEMENT_TRANSFORM_SCALEX_LABEL="ScaleX"
ASTROID_ELEMENT_TRANSFORM_SCALEX_DESC="ScaleX allows you zu animate the hoderizontal scaling of an element."
ASTROID_ELEMENT_TRANSFORM_SCALEY_LABEL="ScaleY"
ASTROID_ELEMENT_TRANSFORM_SCALEY_DESC="ScaleY allows you zu animate the vertical scaling of an element."
ASTROID_ELEMENT_TRANSFORM_SKEWX_LABEL="SkewX"
ASTROID_ELEMENT_TRANSFORM_SKEWX_DESC="SkewX allows you zu animate the hoderizontal skewing of an element."
ASTROID_ELEMENT_TRANSFORM_SKEWY_LABEL="SkewY"
ASTROID_ELEMENT_TRANSFORM_SKEWY_DESC="SkewY allows you zu animate the vertical skewing of an element."
ASTROID_ELEMENT_TRANSFORM_SCROLL_START_LABEL="Start"
ASTROID_ELEMENT_TRANSFORM_SCROLL_START_DESC="The point at which the animation wird start as the verwendenr scrolls. Dies can be defined in pixels oder as a percentage of the viewpodert height. Ex: zup 80%"
ASTROID_ELEMENT_TRANSFORM_SCROLL_END_LABEL="Ende"
ASTROID_ELEMENT_TRANSFORM_SCROLL_END_DESC="The point at which the animation wird end as the verwendenr scrolls. Dies can be defined in pixels oder as a percentage of the viewpodert height. Ex: zup 80% +=500"
ASTROID_ELEMENT_TRANSFORM_SCROLL_SCRUB_LABEL="Scrub"
ASTROID_ELEMENT_TRANSFORM_SCROLL_SCRUB_DESC="The amount of time (in seconds) that the playhead should take zu \"catch up\", so scrub: 0.5 would caverwenden the animation's playhead zu take 0.5 seconds zu catch up mit the scrollbar's position. It's great für smoothing things out."
ASTROID_ELEMENT_TRANSFORM_SCROLL_PIN_LABEL="Pin"
ASTROID_ELEMENT_TRANSFORM_SCROLL_PIN_DESC="Pin allows you zu pin an element in place while the verwendenr scrolls. Dies can create a parallax effect oder allow you zu create sections that stay fixed while other content scrolls past them."
ASTROID_ELEMENT_TRANSFORM_SCROLL_PIN_SPACING_LABEL="Pin Abstund"
ASTROID_ELEMENT_TRANSFORM_SCROLL_PIN_SPACING_DESC="By Stundard, Innenabstund wird added zu the unten zu push other elements down so that wenn the pinned element gets unpinned, the following content catches up optimal. Otherwise, things may scroll UNDER the pinned element. Sie können tell ScrollenTrigger not zu add any Innenabstund by setting <code>pinAbstund: false</code>"
ASTROID_ELEMENT_TRANSFORM_SCROLL_MARKERS_LABEL="Markers"
ASTROID_ELEMENT_TRANSFORM_SCROLL_MARKERS_DESC="Markers are visual indicazuders that show the start und end points of the scroll-triggered animation. They can be helpful für debugging und fine-tuning Ihre animations. Wenn aktiviert, markers wird appear on die Seite zu indicate where the animation wird start und end as the verwendenr scrolls. Dies can help you visualize the animation's trigger points und make adjustments as needed."
ASTROID_ELEMENT_TRANSFORM_SCROLL_TOGGER_ACTIONS_LABEL="Toggle Actions"
ASTROID_ELEMENT_TRANSFORM_SCROLL_TOGGER_ACTIONS_DESC="Toggle Actions allow you zu specify zusätzliche actions that should occur wenn the animation is triggered by scroll events. Foder example, you can specify that a certain class should be added zu an element wenn the animation starts, und removed wenn the animation ends. Dies can be verwendenful für triggering zusätzliche CSS animations oder effects in conjunction mit the scroll-triggered animation."
ASTROID_ELEMENT_TRANSFORM_TWEEN_SETTINGS_LABEL="Tween Einstellungen"
ASTROID_ELEMENT_TRANSFORM_TWEEN_SETTINGS_DESC="A Tween is what does all the animation woderk - think of it like a high-perfürmance property setter. You feed in targets (the objects you want zu animate), a duration, und any properties you want zu animate und wenn its playhead moves zu a new position, it figures out what the property values should be at that point applies them accoderdingly."
ASTROID_ELEMENT_TRANSFORM_DURATION_LABEL="Dauer"
ASTROID_ELEMENT_TRANSFORM_DURATION_DESC="The duration of the animation in seconds. Dies is the amount of time it takes für den animation zu complete one cycle."
ASTROID_ELEMENT_TRANSFORM_REPEAT_LABEL="Repeat"
ASTROID_ELEMENT_TRANSFORM_REPEAT_DESC="Sie können specify the number of times the animation should repeat, oder set it zu -1 für infinite repetition."
ASTROID_ELEMENT_TRANSFORM_EASING_LABEL="Easing"
ASTROID_ELEMENT_TRANSFORM_EASING_DESC="Easing is the primary way zu change the timing of Ihre animation. Simply changing the ease can adjust the entire feel und personality of Ihre animation."
ASTROID_ELEMENT_TRANSFORM_TIMELINE_SETTINGS_LABEL="Timeline Einstellungen"
ASTROID_ELEMENT_TRANSFORM_TIMELINE_SETTINGS_DESC="A Timeline is a powerful sequencing zuol that acts as a container für tweens und other timelines, making it simple zu control them as a whole und precisely manage their timing."

